name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project archive
        run: |Anime_Clicker_v20.zip
          curl -L --fail -o project.zip "https://github.com/mechanik62reg-droid/anime-clicker-android/raw/main/Anime_Clicker_Android_Fixed_Package.zip"
          mkdir extracted
          unzip -q project.zip -d extracted
          PACKAGE_FILE="$(find extracted -name package.json -type f -print -quit)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found!"
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Create Android project
        run: npx cap add android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync game
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Clicker-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
