name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        run: |
          curl -L --fail -o project.zip "https://github.com/mechanik62reg-droid/anime-clicker-android/raw/main/Anime_Clicker_Android_Fixed_Package.zip"
          mkdir project
          unzip -q project.zip -d project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Create Android project
        working-directory: project
        run: npx cap add android

      - name: Sync game
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Clicker-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
