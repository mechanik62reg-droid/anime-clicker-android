name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: Project archive to build
        required: true
        type: choice
        default: Anime_Clicker_v22.zip
        options:
          - Anime_Clicker_v22.zip
          - Anime_Clicker_v21.zip
          - Anime_Clicker_v20.zip
          - Anime_Clicker_v19_Smooth_Scroll_No_Shake.zip
          - Anime_Clicker_Android_v17_Optimized.zip
  push:
    branches:
      - v21-bosses
      - v22-build-pipeline
      - v23-save-normalization
      - v24-progress-missions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARCHIVE: ${{ github.event.inputs.source_archive || 'Anime_Clicker_v22.zip' }}
      SOURCE_BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Download and validate project archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o project.zip "https://raw.githubusercontent.com/mechanik62reg-droid/anime-clicker-android/${SOURCE_BRANCH}/${SOURCE_ARCHIVE}"
          unzip -tq project.zip
          mkdir extracted
          unzip -q project.zip -d extracted
          PACKAGE_FILE="$(find extracted -name package.json -type f -print -quit)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found in selected archive"
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"
          echo "Selected source: $SOURCE_ARCHIVE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply v23 save-state normalization and tests
        if: env.SOURCE_ARCHIVE == 'Anime_Clicker_v22.zip'
        run: |
          node "$GITHUB_WORKSPACE/scripts/patch-v23-save.js" "$PROJECT_DIR/web/index.html"
          GAME_HTML="$PROJECT_DIR/web/index.html" node --test "$GITHUB_WORKSPACE/tests/v23-save-normalization.test.js"

      - name: Apply v24 progress and mission layout fixes
        if: env.SOURCE_ARCHIVE == 'Anime_Clicker_v22.zip'
        run: python3 scripts/patch-v24.py "$PROJECT_DIR/web/index.html"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run project tests when available
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No npm test script in archive; skipping project tests."
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Create Android project
        run: npx cap add android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync game
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Generate build metadata and checksum
        env:
          SOURCE_ARCHIVE: ${{ env.SOURCE_ARCHIVE }}
        run: |
          APK_PATH="${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          mkdir -p release-output
          cp "$APK_PATH" release-output/app-debug.apk
          sha256sum release-output/app-debug.apk > release-output/SHA256SUMS.txt
          {
            echo "Project: Anime Clicker — Star Academy"
            echo "Build label: v24 level progress and missions layout"
            echo "Source archive: $SOURCE_ARCHIVE"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Built UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "APK size bytes: $(stat -c %s release-output/app-debug.apk)"
          } > release-output/BUILD_INFO.txt

      - name: Upload APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Clicker-v24-APK-${{ github.ref_name }}
          path: release-output/
          retention-days: 14
